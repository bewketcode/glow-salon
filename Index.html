<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Salon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h1 class="logo">Glow Salon</h1>

        <div class="hamburger" id="hamburger">☰</div>

        <ul class="nav-menu" id="navMenu">
            <li><a href="#home">Home</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<!-- HERO -->
<section id="home" class="hero">
    <div class="hero-content">
        <h2>Look Beautiful Every Day</h2>
        <p>Professional salon services for you</p>
        <button id="bookBtn">Book Appointment</button>
    </div>
</section>

<!-- SERVICES -->
<section id="services" class="section">
    <h2>Our Services</h2>
    <div class="cards">
        <div class="card">Hair Styling</div>
        <div class="card">Makeup</div>
        <div class="card">Manicure</div>
    </div>
</section>

<!-- ABOUT -->
<section id="about" class="section">
    <h2>About Us</h2>
    <p>We are a professional beauty salon with experienced stylists.</p>
</section>

<!-- CONTACT -->
<section id="contact" class="section">
    <h2>Contact</h2>
    <form>
        <input type="text" placeholder="Name" required>
        <input type="email" placeholder="Email" required>
        <textarea placeholder="Message" required></textarea>
        <button type="submit">Send</button>
    </form>
</section>

<footer>
    <p>© 2026 Glow Salon</p>
</footer>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" id="closeBtn">&times;</span>
        <h2>Book Appointment</h2>

        <form id="bookingForm">
            <input type="text" placeholder="Name" required>
            <input type="tel" placeholder="Phone" required>
            <input type="date" required>
            <button type="submit">Confirm</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
